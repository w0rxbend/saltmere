title: Saltmere
tagline: A daily engineering journal — distributed systems, microservices, Linux, Scala/JVM, IoT, observability & CAD
description: >-
  Short, implementable articles researched and published twice a day. Distributed
  systems theory (van Steen & Tanenbaum), microservices & architecture (Newman),
  distributed system patterns (Burns), practical Linux tools, Scala 3 & the JVM,
  IoT / embedded (Arduino, ESP, air-quality sensors), monitoring & observability,
  and parametric CAD / 3D printing.
author: worxbend
lang: en

# Project site served at https://w0rxbend.github.io/saltmere/
url: "https://w0rxbend.github.io"
baseurl: "/saltmere"

# --- Build settings (GitHub Pages Jekyll) ---
markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-feed

collections:
  articles:
    output: true
    permalink: /:collection/:path/

defaults:
  - scope:
      path: ""
      type: articles
    values:
      layout: article

# Human-readable names + order for the topic tracks.
tracks:
  - id: distributed-systems
    name: Distributed Systems
    blurb: "Foundations & theory — processes, communication, coordination, naming, consistency, fault tolerance & security, following van Steen & Tanenbaum."
  - id: microservices
    name: Microservices & Architecture
    blurb: "Service communication, sagas, service mesh, resiliency & stability patterns, scaling, progressive delivery, zero-trust security, and team topologies — following Sam Newman's Building Microservices."
  - id: sys-patterns
    name: Distributed System Patterns
    blurb: "Reusable patterns — sidecar, ambassador, adapter, replication, sharding, work queues, event-driven & FaaS, plus AI infrastructure — following Brendan Burns' Designing Distributed Systems."
  - id: linux-tools
    name: Practical Linux Tools
    blurb: "Command-line tools and small experiments that teach you how the system actually works."
  - id: scala-jvm
    name: Scala 3 & the JVM
    blurb: "Scala 3 language features, JVM internals, performance and the ecosystem."
  - id: iot-embedded
    name: IoT & Embedded
    blurb: "Arduino, ESP32, air-quality sensors, and backend architecture for massive IoT fleets."
  - id: observability
    name: Monitoring & Observability
    blurb: "Metrics, logs, traces, and the systems that make large backends legible."
  - id: cad-3dprint
    name: CAD & 3D Printing
    blurb: "Parametric modeling with FreeCAD, KiCad, and the print pipeline."

exclude:
  - Gemfile
  - tools
  - _preview
  - Gemfile.lock
  - README.md
  - vendor
